# Properties file for environment specific build tokens
# THIS IS A SAMPLE - ADD REMOVE TOKENS PER PROJECT

%%TARGET%%=${INSTANCE_NAME}

###############################################################################
# SST Unit Tester
###############################################################################
%%SST_VIEW_UNIT_TESTS_WF_TRACE%%=true
%%SST_UT_OUTPUT_PATH%%=/opt/tomcat/instances/${INSTANCE_NAME}/webapps/identityiq/UTReports
%%SST_UT_OUTPUT_PATH_BUILD%%=/opt/tomcat/ssb/web/UTReports
%%SST_IIQ_INSTANCE_NAME%%=identityiq
%%SST_UT_ARGS_PATH%%=/opt/tomcat/ssb/build/extract/WEB-INF/config/custom/ZUnitTests/Args
%%SST_UT_TARGET%%=${INSTANCE_NAME}
%%FILE_SEPARATOR%%=/

###############################################################################
# AD Connector
###############################################################################
%%AD_HOST%%=aviumlabs.test
%%AD_PORT%%=636
%%AD_PROXY_USER%%=CN=svc-iiqad,OU=ServiceAccounts,DC=aviumlabs,DC=test
%%AD_PROXY_PASSWORD%%=myencryptedpasswordstring

