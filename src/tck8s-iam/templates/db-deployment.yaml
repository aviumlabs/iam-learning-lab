apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tck8s-iam.fullname" . }}-db
  labels:
    component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.appName }}-db
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}-db
        component: db
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox
          command: ["chown", "-R", "1000:1000", "/var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: db
          image: {{ .Values.db.image }}
          env:
            - name: POSTGRES_PASSWORD_FILE
              value: "/etc/secrets/db-secret"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: dbpass 
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ include "tck8s-iam.fullname" . }}-db-data
        - name: dbpass
          secret:
            secretName: {{ include "tck8s-iam.fullname" . }}-{{ .Values.db.schemaSecretName }}
            items:
              - key: .secret_db
                path: db-secret
