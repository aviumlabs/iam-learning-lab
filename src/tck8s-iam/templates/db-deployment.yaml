apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tck8s-iam.fullname" . }}-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.appName }}-db
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}-db
    spec:
      containers:
        - name: db
          image: {{ .Values.db.image }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tck8s-iam.fullname" . }}-db-secret
                  key: postgres_password
            - name: POSTGRES_USER
              value: {{ .Values.db.user }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ include "tck8s-iam.fullname" . }}-db-data
