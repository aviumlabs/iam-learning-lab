apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.appName }}-db
    component: db
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.appName }}-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
