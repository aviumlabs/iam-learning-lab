# Persistent Volumes for tck8s-iam
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tck8s-iam-db-data
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: ${PROJECT_ROOT}/volumes/db-data
---
